# All NovaOS user programs. One workspace so they share a target directory and
# the `nova` support library.
[workspace]
resolver = "2"
members = [
    "abi",
    "lib",
    "gfx",
    "wm",
    "hello",
    "sh",
    "ls",
    "cat",
    "echo",
    "mkdir",
    "rm",
    "rmdir",
    "touch",
    "wc",
    "cp",
    "gfxtest",
    "desktop",
    "term",
    "gdemo",
    "ifconfig",
    "ping",
    "nslookup",
    "nettest",
    "fetch",
    "httpd",
    "nc",
    "cksum",
]

[profile.release]
panic = "abort"
opt-level = 2
